name: td-project-api
services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-td_project}
      POSTGRES_USER: ${POSTGRES_USER:-td_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - ./sql:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-td_api}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-td_project}
      GAME_SERVER_API_KEY: ${GAME_SERVER_API_KEY:?Run scripts/setup.ps1 first}
      RUST_LOG: info
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
