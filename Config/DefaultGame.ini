+DirectoriesToAlwaysCook=(Path="/Game/UI/Account/Art")
+DirectoriesToAlwaysCook=(Path="/Game/UI/Loading")
; 아래 폴더들은 "경로 문자열로만" 연결되는 에셋이 들어 있어 반드시 함께 쿠킹해야 한다.
;
; 쿠커는 에셋이 다른 에셋을 참조하는 사슬을 따라가며 패키지에 담을 것을 정한다.
; 그런데 이 프로젝트의 창·테이블·재질은 대부분 프로젝트 세팅(TD UI 등)의 소프트 참조나
; LoadClass 의 경로 문자열로만 연결돼 있다. 이런 참조는 ini 에 적힌 글자일 뿐이라
; 사슬에 잡히지 않고, 쿠커는 "아무도 안 쓰는 에셋" 으로 보고 패키지에서 빼 버린다.
;
; 그러면 에디터에서는 멀쩡하고 패키지에서만 조용히 실패한다. 상점창이 데디 접속
; 클라이언트에서 뜨지 않던 것이 실제로 이것이었다(2026-09-16) — WBP_ShopWindow 가
; 패키지에 없어 LoadClass 가 빈 값을 돌려주고, 코드는 세션을 닫았다.
;
; 새 창·테이블을 만들 때 이 목록은 손대지 않아도 된다. 폴더 단위라 그 안에 넣기만 하면 된다.
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Data")
; Control Bus(CB_*). 볼륨 설정이 이 버스로만 값을 보낸다.
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Class")
; M_PP_Silhouette 처럼 코드·설정에서만 쓰는 재질. 레벨에 배치되지 않아 사슬에 안 잡힌다.
+DirectoriesToAlwaysCook=(Path="/Game/Art/Material")
+DirectoriesToAlwaysStageAsNonUFS=(Path="Loading")

